{% extends "base.html" %}

{% block content %}
<article class="container hero">
  <div class="book-page-header">
    <img src="{{ base_path }}images/{{ image }}" alt="{{ title }} book cover">
    <div>
      <h1>{{ title }}</h1>
      <p class="book-page-meta">{{ authors }}<br>{{ publisher }}, {{ year }}</p>
    </div>
  </div>
  <div class="prose">
    {{ content|safe }}
  </div>
  <a href="{{ base_path }}research.html" class="back-link">← Back to research</a>
</article>
{% endblock %}
