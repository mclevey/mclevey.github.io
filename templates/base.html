<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}{% if title %} – {% endif %}John McLevey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ base_path }}styles.css">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <a href="{{ base_path }}index.html" class="brand">John McLevey</a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle-label">Menu</span>
      <span class="nav-toggle-bars" aria-hidden="true"><span></span><span></span></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <a href="{{ base_path }}research.html"{% if active == 'research' %} class="active" aria-current="page"{% endif %}>Research</a>
      <a href="{{ base_path }}teaching.html"{% if active == 'teaching' %} class="active" aria-current="page"{% endif %}>Teaching</a>
      <a href="{{ base_path }}software-data.html"{% if active == 'software' %} class="active" aria-current="page"{% endif %}>Code &amp; Data</a>
      <a href="{{ base_path }}blog.html"{% if active == 'blog' %} class="active" aria-current="page"{% endif %}>Blog</a>
      <a href="{{ base_path }}cv.html" class="nav-cv{% if active == 'cv' %} active{% endif %}"{% if active == 'cv' %} aria-current="page"{% endif %}>CV</a>
    </nav>
  </header>

  {% block before_main %}{% endblock %}

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-inner">
        <div>© {{ current_year }} John McLevey</div>
        <div class="footer-contact">
          <a href="mailto:mclevey@mun.ca">mclevey@mun.ca</a>
          <span>(709) 864-7447</span>
          <span>Office AA-4055</span>
        </div>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      var toggle = document.querySelector('.nav-toggle');
      var nav = document.getElementById('site-nav');
      toggle.addEventListener('click', function () {
        var open = nav.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && nav.classList.contains('open')) {
          nav.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
          toggle.focus();
        }
      });
    })();
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
