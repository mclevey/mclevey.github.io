{% extends "base.html" %}

{% block head_extra %}
<!-- Highlight.js for syntax highlighting -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
{% endblock %}

{% block content %}
<article class="container hero post">
  <header class="post-header">
    <p class="post-meta">{{ date_display or date }} · {{ author }}</p>
    <h1>{{ title }}</h1>
  </header>
  <div class="prose post-content">
    {{ content|safe }}
  </div>
  <a href="{{ base_path }}blog.html" class="back-link">← Back to blog</a>
</article>
{% endblock %}

{% block scripts %}
<!-- Lightbox for images -->
<div class="lightbox-overlay" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lightbox-close" aria-label="Close image viewer">&times;</button>
  <img alt="" id="lightbox-img">
</div>

<script>
  hljs.highlightAll();

  // Lightbox
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');

  document.querySelectorAll('.post-content img').forEach(img => {
    img.addEventListener('click', () => {
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightbox.classList.add('active');
    });
  });

  lightbox.addEventListener('click', () => {
    lightbox.classList.remove('active');
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') lightbox.classList.remove('active');
  });
</script>
{% endblock %}
